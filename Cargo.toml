[package]
name = "code-buster"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "Repository-aware static analysis for AI-assisted development"
repository = "https://github.com/tool-bunker/code-buster"
license = "MIT"
publish = false

[[bin]]
name = "cb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "=0.3.47", features = ["macros", "parsing"] }
toml = { version = "0.9", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[lints.rust]
unsafe_code = "forbid"
