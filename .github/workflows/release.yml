name: Code Buster Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/release_version.dart '${{ github.ref_name }}'
      - run: dart format --output=none --set-exit-if-changed bin example lib tool/*.dart
      - run: dart analyze
      - run: dart run tool/default_contract.dart
      - run: dart test
      - run: dart doc --dry-run
      - run: dart pub publish --dry-run
      - name: Validate pub.dev package quality
        run: |
          dart pub global activate pana
          pana --no-warning .
      - run: python3 tool/release_evidence.py
      - name: Rebuild precision evidence
        run: |
          mkdir -p build
          dart compile exe bin/cb.dart -o build/cb
          python3 tool/precision_benchmark.py

  artifacts:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: cb
            archive: code-buster-linux-x64.tar.gz
          - os: macos-13
            platform: macos-x64
            executable: cb
            archive: code-buster-macos-x64.tar.gz
          - os: windows-latest
            platform: windows-x64
            executable: cb.exe
            archive: code-buster-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Compile
        shell: bash
        run: dart compile exe bin/cb.dart -o '${{ matrix.executable }}'
      - name: Smoke test
        shell: bash
        run: |
          './${{ matrix.executable }}' version
          './${{ matrix.executable }}' preview --root test/fixtures/mixed_realistic --format json > preview.json
          './${{ matrix.executable }}' summary --root test/fixtures/mixed_realistic --format json > summary.json
      - name: Archive Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf '${{ matrix.archive }}' '${{ matrix.executable }}' LICENSE README.md
      - name: Archive Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.executable }}',LICENSE,README.md -DestinationPath '${{ matrix.archive }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish-github-release:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish GitHub release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
