name: Code Buster CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/cb
            completion-shell: bash
          - os: macos-15
            binary: target/release/cb
            completion-shell: zsh
          - os: windows-latest
            binary: target/release/cb.exe
            completion-shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --release --locked
      - name: Smoke release binary
        shell: bash
        run: |
          '${{ matrix.binary }}' version
          '${{ matrix.binary }}' preview --root tests/fixtures/preview --format json > preview.json
          '${{ matrix.binary }}' summary --root tests/fixtures/preview --format json --advisory --allow-empty > summary.json
          '${{ matrix.binary }}' completions '${{ matrix.completion-shell }}' > completion.txt

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo package --locked
      - run: ./tool/rehearse-release.sh "$RUNNER_TEMP/cb-rehearsal"
