name: Code Buster CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Check production formatting
        run: dart format --output=none --set-exit-if-changed bin example lib tool/*.dart
      - run: dart analyze
      - name: Check default compatibility contract
        run: dart run tool/default_contract.dart
      - name: Compile test CLI
        run: |
          mkdir -p build
          dart compile exe bin/cb.dart -o build/cb-test
      - run: dart test
        env:
          CODE_BUSTER_TEST_EXECUTABLE: ${{ github.workspace }}/build/cb-test
      - run: dart doc --dry-run
      - name: Check Unix installer syntax
        run: sh -n website/install
      - name: Smoke-test Code Buster
        run: |
          build/cb-test version
          python3 tool/precision_benchmark.py --executable build/cb-test

  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0
      - run: dart pub get
      - run: dart analyze
      - name: Compile test CLI
        run: |
          mkdir -p build
          dart compile exe bin/cb.dart -o build/cb-test
      - run: dart test
        env:
          CODE_BUSTER_TEST_EXECUTABLE: ${{ github.workspace }}/build/cb-test

  compile:
    needs: [verify, minimum-sdk]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
          - os: macos-latest
            suffix: ''
          - os: windows-latest
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Compile Code Buster
        shell: bash
        run: |
          mkdir -p build
          dart compile exe bin/cb.dart -o "build/cb${{ matrix.suffix }}"
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'website/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: cb-${{ matrix.os }}
          path: build/cb${{ matrix.suffix }}
          if-no-files-found: error
