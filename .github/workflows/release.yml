name: Code Buster Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version already prepared on main, without the v prefix
        required: true
        type: string

concurrency:
  group: code-buster-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Using existing tag $RELEASE_TAG."
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases must be dispatched from main.' >&2
          exit 1
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/release_version.dart 'v${{ inputs.version }}'
      - run: dart format --output=none --set-exit-if-changed bin example lib tool/*.dart
      - run: dart analyze
      - run: dart run tool/default_contract.dart
      - run: dart test -j 1
      - run: dart doc --dry-run
      - run: dart pub publish --dry-run
      - name: Validate pub.dev package quality
        run: |
          dart pub global activate pana
          pana --no-warning .
      - run: python3 tool/release_evidence.py
      - name: Rebuild precision evidence
        run: |
          mkdir -p build
          dart compile exe bin/cb.dart -o build/cb
          python3 tool/precision_benchmark.py

  artifacts:
    needs: [resolve-tag, verify]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: cb
            archive: code-buster-linux-x64.tar.gz
          - os: macos-15
            platform: macos-arm64
            executable: cb
            archive: code-buster-macos-arm64.tar.gz
          - os: windows-latest
            platform: windows-x64
            executable: cb.exe
            archive: code-buster-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Compile
        shell: bash
        run: dart compile exe bin/cb.dart -o '${{ matrix.executable }}'
      - name: Smoke test
        shell: bash
        run: |
          './${{ matrix.executable }}' version
          './${{ matrix.executable }}' preview --root test/fixtures/mixed_realistic --format json > preview.json
          './${{ matrix.executable }}' summary --root test/fixtures/mixed_realistic --format json > summary.json
      - name: Archive Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf '${{ matrix.archive }}' '${{ matrix.executable }}' LICENSE README.md
      - name: Archive Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.executable }}',LICENSE,README.md -DestinationPath '${{ matrix.archive }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish-github-release:
    needs: [resolve-tag, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract reviewed changelog notes
        run: dart run tool/release_notes.dart '${{ needs.resolve-tag.outputs.tag }}' release-notes.md
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish GitHub release with changelog notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*
